HTML 강의 메모


<!-- 
TAG 실습 
<strong> </strong> : 볼드 처리
<u> </u> : underline -> 밑줄 처리
-->

<h1>This is heading 1</h1>  
<h2>This is heading 1</h2>  
<h3>This is heading 1</h3>  
<h4>This is heading 1</h4>
<h5>This is heading 1</h5>  
<h6>This is heading 1</h6>  

<!-- 
* 제목을 나타내는 태그
h1 ~ h6 
-->

<!-- 
* 줄바꿈 태그
<br> 

* 단락 태그
<p> </p>
-->

<!--
* 이미지를 가져오는 태그 
<img> 

* 이미지의 주소를 가져오는 것
src="" -> source를 줄여서 scr

<img src="dog.jpg" width="100%">
- src, width는 속성 즉 Attribute라고 함
-->
